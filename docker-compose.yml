services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mars-research-system:local
    container_name: mars-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      # Mount source for hot-reload during local dev (remove for prod)
      - ./mars:/app/mars:ro
      - ./app.py:/app/app.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
