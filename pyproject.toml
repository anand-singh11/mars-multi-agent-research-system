[project]
name = "mars-multi-agent-research-system"
version = "1.0.0"
description = "MARS: A multi-agent AI research system powered by LangGraph, Groq, and Tavily"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "MARS Team" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.2",
    "langchain>=0.3.20,<0.4.0",
    "langchain-community>=0.3.5",
    "langchain-core>=0.3.15",
    "langchain-groq>=0.3.2",
    "langchain-tavily>=0.2.0",
    "langgraph>=0.2.45",
    "python-dotenv>=1.0.1",
    "streamlit>=1.39.0",
    "tavily-python>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "__pycache__", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # line length handled separately

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.setuptools]
packages = ["mars"]
py-modules = ["app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
]
